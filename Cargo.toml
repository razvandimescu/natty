[workspace]
members = ["relay"]
default-members = [".", "relay"]

[workspace.lints.clippy]
cognitive_complexity = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package]
name = "natty"
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NAT traversal library: QUIC to a peer's public key, direct by hole punching or relayed"
repository = "https://github.com/razvandimescu/natty"
keywords = ["nat-traversal", "hole-punching", "relay", "p2p", "quic"]
categories = ["network-programming"]
include = ["src/**", "examples/**", "README.md", "LICENSE-*"]

[lints]
workspace = true

[features]
default = ["quic"]
quic = ["dep:quinn", "dep:log", "tokio/macros", "tokio/rt", "tokio/time"]

[dependencies]
log = { version = "0.4", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
ring = "0.17"
tokio = { version = "1", features = ["io-util", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
webpki-roots = "1"

[[example]]
name = "pipe"
required-features = ["quic"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
