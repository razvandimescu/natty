[workspace]
members = ["relay"]
default-members = [".", "relay"]

[workspace.lints.clippy]
cognitive_complexity = "warn"

[package]
name = "natty"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "NAT traversal, no frameworks: rendezvous, hole punching, and relay fallback for key-addressed peers"
repository = "https://github.com/razvandimescu/natty"
keywords = ["nat", "hole-punching", "relay", "p2p", "quic"]
categories = ["network-programming"]

[lints]
workspace = true

[features]
default = ["quic"]
quic = ["dep:quinn", "tokio/macros", "tokio/rt", "tokio/time"]

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
ring = "0.17"
tokio = { version = "1", features = ["io-util", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
webpki-roots = "1"

[[example]]
name = "pipe"
required-features = ["quic"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
