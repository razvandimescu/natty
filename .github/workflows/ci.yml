name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new RustSec advisory shows up without a push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      # Also caches ~/.cargo/bin, so cargo-audit compiles once, not on every run.
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: make lint
      - run: make test
