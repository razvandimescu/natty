name: fuzz

# libFuzzer over the parsers of untrusted input. A PR that changes one gets a
# short run, the weekly run goes deeper. Linux only: cargo-fuzz hangs before
# main under ASan on recent macOS.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wire.rs'
      - 'src/stun.rs'
      - 'src/key.rs'
      - 'src/endpoint/signal.rs'
      - 'src/endpoint/mod.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to fuzz each target'
        default: '120'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # -max_total_time is checked between inputs, so one hanging input needs this limit.
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ inputs.seconds || (github.event_name == 'schedule' && '300' || '60') }}
    strategy:
      fail-fast: false
      matrix:
        target: [frame, stun_request, stun_response, signal, key]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-01
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # install-action serves a musl cargo-fuzz, which builds for musl by default,
      # and the toolchain has only the gnu std.
      - name: Resolve host triple
        run: echo "FUZZ_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      # restore and save, not actions/cache: its save runs only on success, and a
      # crashing run has the corpus that matters.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # fuzz/seeds is committed and read-only; new inputs go to fuzz/corpus.
      - name: Fuzz ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target "$FUZZ_TRIPLE" ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=${FUZZ_SECONDS} -max_len=4096 -timeout=25
      # Only weekly: cmin re-runs the whole corpus, and without it the cache grows.
      - name: Minimize corpus
        if: github.event_name == 'schedule'
        run: cargo fuzz cmin --target "$FUZZ_TRIPLE" ${{ matrix.target }} -- -timeout=25
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
